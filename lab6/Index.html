<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        form {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            width: 280px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #218838;
        }
        input[type="radio"] {
            width: auto;
            margin-right: 5px;
        }
        label[for="male"], label[for="female"] {
            font-weight: normal;
            color: #495057;
        }
        h2 {
            text-align: center;
            color: #343a40;
            margin-bottom: 20px;
        }
        #successMessage {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #28a745;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <form id="registrationForm">
        <h2>Реєстрація</h2>
        <label for="name">Ім'я:</label>
        <input type="text" id="name" name="name" required>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <label for="password">Пароль:</label>
        <input type="password" id="password" name="password" required>
        <label for="confirmPassword">Підтвердіть пароль:</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required>
        <label for="age">Вік:</label>
        <input type="number" id="age" name="age" required>
        <label>Стать:</label>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Чоловік</label>
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female">Жінка</label>
        <label for="group">Група:</label>
        <select id="group" name="group" required>
            <option value="">Оберіть групу</option>
            <option value="kn21">КН-21</option>
            <option value="kn31">КН-31</option>
            <option value="kn41">КН-41</option>
        </select>
        <button type="submit">Зареєструватися</button>
    </form>
    <div id="successMessage">Ви успішно зареєструвалися!</div>
    <script>
        document.getElementById('registrationForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const fields = ['name', 'email', 'password', 'confirmPassword', 'age'];
            const values = fields.map(id => document.getElementById(id).value.trim());
            const gender = document.querySelector('input[name="gender"]:checked');
            const group = document.getElementById('group').value;

            if (values.includes('') || !gender || !group) {
                return alert('Будь ласка, заповніть всі поля!');
            }
            if (values[2] !== values[3]) return alert('Паролі не співпадають!');
            if (values[2].length < 6) return alert('Пароль має містити мінімум 6 символів!');

            alert('Реєстрація успішна! Дякуємо за реєстрацію, ' + values[0] + '!');
            document.getElementById('successMessage').style.display = 'block';
            this.reset();
        });
    </script>
</body>
</html>
