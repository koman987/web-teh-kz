<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №9 - To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .task-list {
            list-style-type: none;
            padding: 0;
        }
        .task-list li {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .task-list li.completed {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>
<body>
    <h1>To-Do List</h1>
    <input type="text" id="taskInput" placeholder="Введіть завдання">
    <button id="addTaskButton">Додати</button>
    <button id="sortButton">Сортувати</button>
    <ul id="taskList" class="task-list"></ul>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const taskInput = document.getElementById("taskInput");
            const addTaskButton = document.getElementById("addTaskButton");
            const sortButton = document.getElementById("sortButton");
            const taskList = document.getElementById("taskList");

            // Завантаження завдань із LocalStorage
            const loadTasks = () => {
                const tasks = JSON.parse(localStorage.getItem("tasks")) || [];
                tasks.forEach(task => addTaskToDOM(task.text, task.completed));
            };

            // Збереження завдань у LocalStorage
            const saveTasks = () => {
                const tasks = [];
                document.querySelectorAll("#taskList li").forEach(taskItem => {
                    tasks.push({
                        text: taskItem.querySelector(".task-text").textContent,
                        completed: taskItem.classList.contains("completed")
                    });
                });
                localStorage.setItem("tasks", JSON.stringify(tasks));
            };

            // Додавання завдання до DOM
            const addTaskToDOM = (text, completed = false) => {
                const li = document.createElement("li");
                li.className = completed ? "completed" : "";

                const span = document.createElement("span");
                span.className = "task-text";
                span.textContent = text;

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.checked = completed;
                checkbox.addEventListener("change", () => {
                    li.classList.toggle("completed");
                    saveTasks();
                });

                const editButton = document.createElement("button");
                editButton.textContent = "Редагувати";
                editButton.addEventListener("click", () => {
                    const newText = prompt("Редагувати завдання:", span.textContent);
                    if (newText !== null && newText.trim() !== "") {
                        span.textContent = newText.trim();
                        saveTasks();
                    }
                });

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "Видалити";
                deleteButton.addEventListener("click", () => {
                    li.remove();
                    saveTasks();
                });

                li.appendChild(checkbox);
                li.appendChild(span);
                li.appendChild(editButton);
                li.appendChild(deleteButton);
                taskList.appendChild(li);
            };

            // Обробник додавання завдання
            addTaskButton.addEventListener("click", () => {
                const taskText = taskInput.value.trim();
                if (taskText) {
                    addTaskToDOM(taskText);
                    saveTasks();
                    taskInput.value = "";
                }
            });

            // Обробник сортування завдань
            sortButton.addEventListener("click", () => {
                const tasks = Array.from(document.querySelectorAll("#taskList li"));
                tasks.sort((a, b) => {
                    const textA = a.querySelector(".task-text").textContent.toLowerCase();
                    const textB = b.querySelector(".task-text").textContent.toLowerCase();
                    return textA.localeCompare(textB);
                });
                taskList.innerHTML = "";
                tasks.forEach(task => taskList.appendChild(task));
                saveTasks();
            });

            // Завантаження завдань при завантаженні сторінки
            loadTasks();
        });
    </script>
</body>
</html>
